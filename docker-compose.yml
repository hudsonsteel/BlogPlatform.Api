services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: blogplatform-api:local
    container_name: blogplatform-api
    ports:
      - "5183:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Data Source=/app/data/blogplatform.db
    volumes:
      - blogplatform-data:/app/data
      - blogplatform-logs:/app/logs
    restart: unless-stopped

volumes:
  blogplatform-data:
  blogplatform-logs:
